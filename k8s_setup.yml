---
# =============================================================================
# OpsLab - Kubernetes Cluster Setup (Rocky Linux 9 + containerd + Calico)
# Nodes: k8s-master (10.0.0.18) + k8s-node1 (10.0.0.19) + k8s-node2 (10.0.0.20)
# Usage: ansible-playbook k8s_setup.yml
# =============================================================================

- name: "STEP 1 / 5 - K8s 节点系统预配置（所有节点）"
  hosts: k8s
  gather_facts: yes
  become: yes
  vars:
    pod_cidr: "10.244.0.0/16"
    svc_cidr: "10.96.0.0/12"
    k8s_version: ""       # 空字符串=最新版；例: "1.30.3-150500.1.1.el9"
  tasks:

    # -------- 1.1 基础工具包 --------
    - name: 安装基础依赖和工具
      dnf:
        name:
          - yum-utils
          - device-mapper-persistent-data
          - lvm2
          - iproute-tc
          - conntrack-tools
          - socat
          - curl
          - wget
          - vim
          - net-tools
          - bind-utils
          - jq
          - tar
        state: present
        disable_excludes: all

    # -------- 1.2 hosts 解析 --------
    - name: 写入各节点 /etc/hosts 条目
      lineinfile:
        path: /etc/hosts
        line: "{{ item }}"
        create: yes
      loop:
        - "10.0.0.18 k8s-master.opslab.local k8s-master"
        - "10.0.0.19 k8s-node1.opslab.local  k8s-node1"
        - "10.0.0.20 k8s-node2.opslab.local  k8s-node2"

    # -------- 1.3 关闭 Swap --------
    - name: 临时关闭 swap
      command: swapoff -a
      changed_when: false

    - name: 永久关闭 swap (fstab)
      replace:
        path: /etc/fstab
        regexp: '^(\s*[^#\s]+\s+swap\s+.*)$'
        replace: '# \1'

    # -------- 1.4 禁用 firewalld --------
    - name: 停止并禁用 firewalld
      systemd:
        name: firewalld
        state: stopped
        enabled: no
      ignore_errors: yes

    # -------- 1.5 SELinux 设置为 Permissive --------
    - name: 设置 SELinux 为 permissive（运行时）
      command: setenforce 0
      ignore_errors: yes
      changed_when: false

    - name: 设置 SELinux 为 permissive（永久）
      lineinfile:
        path: /etc/selinux/config
        regexp: '^SELINUX='
        line: 'SELINUX=permissive'

    # -------- 1.6 内核模块 --------
    - name: 写入内核模块加载配置 (overlay + br_netfilter)
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: '0644'

    - name: 加载 overlay 模块
      modprobe:
        name: overlay
        state: present

    - name: 加载 br_netfilter 模块
      modprobe:
        name: br_netfilter
        state: present

    # -------- 1.7 sysctl 网络参数 --------
    - name: 写入 K8s 所需 sysctl 参数
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        mode: '0644'

    - name: 应用 sysctl 参数
      command: sysctl --system
      changed_when: false

    # -------- 1.8 时间同步 --------
    - name: 启动并启用 chronyd
      systemd:
        name: chronyd
        state: started
        enabled: yes

    - name: 设置时区为 Asia/Shanghai
      timezone:
        name: Asia/Shanghai

# =============================================================================
- name: "STEP 2 / 5 - 安装 containerd 容器运行时（所有节点）"
  hosts: k8s
  gather_facts: no
  become: yes
  tasks:

    - name: 添加 Docker CE (containerd) YUM 仓库
      yum_repository:
        name: docker-ce-stable
        description: Docker CE Stable
        baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
        gpgcheck: yes
        gpgkey: "https://download.docker.com/linux/centos/gpg"
        enabled: yes

    - name: 安装 containerd.io
      dnf:
        name: containerd.io
        state: present
        disable_excludes: all

    - name: 生成 containerd 默认配置目录
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: 生成 containerd 默认配置
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: 启用 SystemdCgroup (cgroup v2 兼容)
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup\s*=\s*false'
        replace: 'SystemdCgroup = true'

    - name: 设置 containerd 镜像加速 / sandbox_image
      lineinfile:
        path: /etc/containerd/config.toml
        regexp: '^\s*sandbox_image\s*='
        line: "        sandbox_image = \"registry.k8s.io/pause:3.10\""
        insertafter: '\[plugins\."io\.containerd\.grpc\.v1\.cri"\]'

    - name: 启动并启用 containerd
      systemd:
        name: containerd
        state: started
        enabled: yes
        daemon_reload: yes

# =============================================================================
- name: "STEP 3 / 5 - 安装 kubeadm / kubelet / kubectl（所有节点）"
  hosts: k8s
  gather_facts: no
  become: yes
  tasks:

    - name: 添加 Kubernetes YUM 仓库
      yum_repository:
        name: kubernetes
        description: Kubernetes
        baseurl: "https://pkgs.k8s.io/core:/stable:/v1.31/rpm/"
        gpgcheck: yes
        gpgkey:
          - "https://pkgs.k8s.io/core:/stable:/v1.31/rpm/repodata/repomd.xml.key"
        enabled: yes
        exclude: "kubelet kubeadm kubectl cri-tools kubernetes-cni"

    - name: 安装 kubeadm / kubelet / kubectl
      dnf:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        disable_excludes: kubernetes

    - name: 启用 kubelet (开机自启，kubeadm 会 start)
      systemd:
        name: kubelet
        enabled: yes
        daemon_reload: yes

# =============================================================================
- name: "STEP 4 / 5 - 初始化 k8s-master 控制平面"
  hosts: k8s_master
  gather_facts: no
  become: yes
  vars:
    master_ip: "10.0.0.18"
    pod_cidr: "10.244.0.0/16"
    svc_cidr: "10.96.0.0/12"
  tasks:

    - name: 检查 kubeadm 是否已初始化（/etc/kubernetes/admin.conf）
      stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: 执行 kubeadm init
      command: >
        kubeadm init
        --apiserver-advertise-address={{ master_ip }}
        --apiserver-bind-port=6443
        --kubernetes-version=stable-1
        --pod-network-cidr={{ pod_cidr }}
        --service-cidr={{ svc_cidr }}
        --service-dns-domain=cluster.local
        --node-name={{ ansible_hostname | default(inventory_hostname) }}
        --v=5
      when: not admin_conf.stat.exists
      register: kubeadm_init
      timeout: 900

    - name: kubeadm init 结果
      debug:
        msg: "{{ kubeadm_init.stdout_lines[-20:] }}"
      when: kubeadm_init is changed

    - name: 创建 root 用户 .kube 目录
      file:
        path: /root/.kube
        state: directory
        mode: '0755'

    - name: 拷贝 admin.conf 到 root .kube
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes
        mode: '0600'

    - name: 设置 KUBECONFIG 环境变量
      lineinfile:
        path: /root/.bashrc
        line: 'export KUBECONFIG=/root/.kube/config'
        create: yes

    # -------- 安装 Calico CNI --------
    - name: 下载 Tigera Calico operator YAML
      get_url:
        url: "https://raw.githubusercontent.com/projectcalico/calico/v3.28.2/manifests/tigera-operator.yaml"
        dest: /root/tigera-operator.yaml
        mode: '0644'
      environment:
        https_proxy: ""
      ignore_errors: yes
      register: operator_download

    - name: 创建 Calico custom-resources YAML（匹配 pod CIDR）
      copy:
        dest: /root/calico-cr.yaml
        content: |
          apiVersion: operator.tigera.io/v1
          kind: Installation
          metadata:
            name: default
          spec:
            calicoNetwork:
              ipPools:
              - blockSize: 26
                cidr: {{ pod_cidr }}
                encapsulation: VXLANCrossSubnet
                natOutgoing: Enabled
                nodeSelector: all()
            nodeAddressAutodetectionV4:
              interface: "ens33"

    - name: 应用 Tigera Calico operator
      command: kubectl apply -f /root/tigera-operator.yaml
      register: operator_apply
      changed_when: "'created' in operator_apply.stdout or 'configured' in operator_apply.stdout"
      when: operator_download is succeeded

    - name: 等待 operator 就绪（30 秒）
      pause:
        seconds: 30

    - name: 应用 Calico custom-resources（启用 CNI）
      command: kubectl apply -f /root/calico-cr.yaml
      register: cr_apply
      changed_when: "'created' in cr_apply.stdout or 'configured' in cr_apply.stdout"

    - name: 生成 worker join 命令
      command: kubeadm token create --print-join-command
      register: join_cmd
      changed_when: false

    - name: 保存 join 命令到本地文件
      copy:
        content: "{{ join_cmd.stdout }}"
        dest: /root/kubeadm_join.sh
        mode: '0700'

    - name: 取回 join 命令（供后续 worker 加入）
      set_fact:
        kubeadm_join_cmd: "{{ join_cmd.stdout }}"

# =============================================================================
- name: "STEP 5 / 5 - Worker 节点加入集群"
  hosts: k8s_workers
  gather_facts: no
  become: yes
  tasks:

    - name: 检查是否已加入集群（kubelet kubeconfig 存在）
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: 从 master 读取 join 命令
      command: cat /root/kubeadm_join.sh
      register: remote_join
      delegate_to: k8s-master
      changed_when: false
      run_once: true

    - name: 执行 kubeadm join
      command: "{{ remote_join.stdout }}"
      when: not kubelet_conf.stat.exists
      register: kubeadm_join
      timeout: 600

    - name: 显示 worker join 结果
      debug:
        msg: "{{ kubeadm_join.stdout_lines[-10:] }}"
      when: kubeadm_join is changed
