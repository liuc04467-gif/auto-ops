# 应用配置：Redis 读写分离连接参数（与应用 Deployment 同命名空间 opslab）
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: opslab
data:
  REDIS_WRITE_HOST: "redis-master.cache.svc.cluster.local"
  REDIS_READ_HOST: "redis-slave.cache.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "Redis12345"
