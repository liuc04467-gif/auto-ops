global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "node"
    static_configs:
      - targets:
          - "10.0.0.10:9100"
          - "10.0.0.11:9100"
          - "10.0.0.12:9100"
          - "10.0.0.13:9100"
          - "10.0.0.14:9100"
          - "10.0.0.15:9100"
          - "10.0.0.16:9100"
          - "10.0.0.17:9100"

  - job_name: "haproxy"
    static_configs:
      - targets:
          - "10.0.0.11:9101"
          - "10.0.0.12:9101"

  - job_name: "mysql"
    static_configs:
      - targets:
          - "10.0.0.15:9104"
          - "10.0.0.16:9104"

  # K8s 节点（node_exporter 待部署到 k8s-master/node1/node2 后启用）
  - job_name: "k8s-node"
    static_configs:
      - targets:
          - "10.0.0.18:9100"   # k8s-master（待部署 node_exporter）
          - "10.0.0.19:9100"   # k8s-node1（待部署 node_exporter）
          - "10.0.0.20:9100"   # k8s-node2（待部署 node_exporter）

  # K8s 集群指标（进阶）：使用 Prometheus Operator + ServiceMonitor 采集
  #   - kube-state-metrics（Deployment/StatefulSet/Pod 指标）
  #   - cAdvisor（内置于 kubelet :10250）
  #   - kubelet metrics（:10250/metrics）
  # 部署方式：helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack
