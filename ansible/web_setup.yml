---
# ============================================================
# 阶段二：Web 应用层
# - Nginx + PHP-FPM 部署到 web01/web02
# - NFS 共享存储（m1 为服务端）
# ============================================================

# ========================================
# Part A: NFS 服务端（m1）
# ========================================
- name: Setup NFS server on m1
  hosts: m1
  gather_facts: yes
  vars:
    nfs_path: /data/web
    nfs_subnet: "10.0.0.0/24"

  tasks:
    - name: Install NFS server
      dnf:
        name: nfs-utils
        state: present

    - name: Create shared directory
      file:
        path: "{{ nfs_path }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure NFS exports
      lineinfile:
        path: /etc/exports
        line: "{{ nfs_path }} {{ nfs_subnet }}(rw,sync,no_root_squash)"
        regexp: "^{{ nfs_path }}"
        create: yes

    - name: Export NFS shares
      command: exportfs -ra
      changed_when: false

    - name: Start and enable NFS server
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - rpcbind
        - nfs-server

    - name: Open NFS ports in firewall
      firewalld:
        service: "{{ item }}"
        permanent: yes
        state: enabled
      loop:
        - nfs
        - rpc-bind
        - mountd
      notify: reload firewalld

  handlers:
    - name: reload firewalld
      systemd:
        name: firewalld
        state: reloaded


# ========================================
# Part B: Nginx + PHP-FPM + NFS 客户端（web01/web02）
# ========================================
- name: Setup Nginx + PHP-FPM on web servers
  hosts: web
  gather_facts: yes
  vars:
    nfs_server: "10.0.0.10"
    nfs_path: /data/web
    nfs_mount: /data/web
    web_root: /data/web/html

  tasks:
    # --------------------------------------------------
    # 1. 安装软件包
    # --------------------------------------------------
    - name: Install Nginx, PHP-FPM, and NFS client
      dnf:
        name:
          - nginx
          - php
          - php-fpm
          - php-mysqlnd
          - php-cli
          - php-common
          - php-json
          - php-mbstring
          - php-xml
          - nfs-utils
        state: present

    # --------------------------------------------------
    # 2. 创建用户和目录
    # --------------------------------------------------
    - name: Ensure nginx group exists
      group:
        name: nginx
        state: present

    - name: Create NFS mount point
      file:
        path: "{{ nfs_mount }}"
        state: directory
        owner: nginx
        group: nginx
        mode: "0755"

    # --------------------------------------------------
    # 3. 挂载 NFS
    # --------------------------------------------------
    - name: Mount NFS share
      mount:
        path: "{{ nfs_mount }}"
        src: "{{ nfs_server }}:{{ nfs_path }}"
        fstype: nfs
        opts: rw,sync,hard,intr
        state: mounted

    - name: Create web root directory
      file:
        path: "{{ web_root }}"
        state: directory
        owner: nginx
        group: nginx
        mode: "0755"

    # --------------------------------------------------
    # 4. 配置 PHP-FPM
    # --------------------------------------------------
    - name: Configure PHP-FPM to use nginx user
      lineinfile:
        path: /etc/php-fpm.d/www.conf
        regexp: "^{{ item.key }}"
        line: "{{ item.key }} = {{ item.value }}"
      loop:
        - { key: "user", value: "nginx" }
        - { key: "group", value: "nginx" }
        - { key: "listen.owner", value: "nginx" }
        - { key: "listen.group", value: "nginx" }
      notify: restart php-fpm

    - name: Ensure PHP session directory exists
      file:
        path: /var/lib/php/session
        state: directory
        owner: nginx
        group: nginx
        mode: "0770"

    # --------------------------------------------------
    # 5. 配置 Nginx
    # --------------------------------------------------
    - name: Deploy Nginx site config
      copy:
        content: |
          server {
              listen       80;
              server_name  _;
              root         {{ web_root }};

              index index.php index.html index.htm;

              access_log  /var/log/nginx/access.log  main;
              error_log   /var/log/nginx/error.log;

              location / {
                  try_files $uri $uri/ /index.php?$query_string;
              }

              location ~ \.php$ {
                  fastcgi_pass   unix:/run/php-fpm/www.sock;
                  fastcgi_index  index.php;
                  fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
                  include        fastcgi_params;
              }

              location ~ /\.ht {
                  deny all;
              }
          }
        dest: /etc/nginx/conf.d/default.conf
        backup: yes
      notify: restart nginx

    # --------------------------------------------------
    # 6. 部署测试页面
    # --------------------------------------------------
    - name: Deploy test PHP page
      copy:
        content: |
          <?php
          header('Content-Type: text/html; charset=utf-8');
          $hostname = gethostname();
          $ip = $_SERVER['SERVER_ADDR'];
          echo "<h1>OpsLab Web Server</h1>";
          echo "<p><strong>Hostname:</strong> $hostname</p>";
          echo "<p><strong>IP:</strong> $ip</p>";
          echo "<p><strong>PHP Version:</strong> " . phpversion() . "</p>";
          echo "<p><strong>Time:</strong> " . date('Y-m-d H:i:s') . "</p>";
          echo "<hr>";
          echo "<p>Refresh the page to see HAProxy round-robin in action!</p>";

          // PHP info page
          if (isset($_GET['info'])) {
              phpinfo();
          }
          ?>
        dest: "{{ web_root }}/index.php"
        owner: nginx
        group: nginx
        mode: "0644"

    - name: Deploy health check page
      copy:
        content: "OK"
        dest: "{{ web_root }}/health"
        owner: nginx
        group: nginx
        mode: "0644"

    # --------------------------------------------------
    # 7. 防火墙
    # --------------------------------------------------
    - name: Open HTTP/HTTPS ports
      firewalld:
        service: "{{ item }}"
        permanent: yes
        state: enabled
      loop:
        - http
        - https
      notify: reload firewalld

    # --------------------------------------------------
    # 8. 启动服务
    # --------------------------------------------------
    - name: Start and enable PHP-FPM
      systemd:
        name: php-fpm
        state: started
        enabled: yes

    - name: Start and enable Nginx
      systemd:
        name: nginx
        state: started
        enabled: yes

  handlers:
    - name: restart php-fpm
      systemd:
        name: php-fpm
        state: restarted

    - name: restart nginx
      systemd:
        name: nginx
        state: restarted

    - name: reload firewalld
      systemd:
        name: firewalld
        state: reloaded