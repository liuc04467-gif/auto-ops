---
- name: OpsLab initial server setup
  hosts: servers
  gather_facts: yes
  tasks:
    - name: Install EPEL repo
      dnf:
        name: epel-release
        state: present

    - name: Install common tools
      dnf:
        name:
          - vim
          - wget
          - curl
          - git
          - tar
          - unzip
          - lsof
          - tcpdump
          - telnet
          - net-tools
          - bind-utils
          - sysstat
          - htop
          - bash-completion
          - rsync
          - nfs-utils
          - chrony
          - firewalld
        state: present

    - name: Ensure chronyd is running
      systemd:
        name: chronyd
        state: started
        enabled: yes

    - name: Set timezone to Asia/Shanghai
      timezone:
        name: Asia/Shanghai

    - name: Install python3-libselinux
      dnf:
        name: python3-libselinux
        state: present

    - name: Disable SELinux (for ops convenience)
      lineinfile:
        path: /etc/selinux/config
        regexp: '^SELINUX='
        line: SELINUX=disabled

    - name: Set SELinux permissive now
      command: setenforce 0
      ignore_errors: yes

    - name: Configure firewall - allow common services
      firewalld:
        service: "{{ item }}"
        permanent: yes
        state: enabled
      loop:
        - ssh
        - http
        - https

    - name: Reload firewalld
      systemd:
        name: firewalld
        state: reloaded

    - name: Update all packages
      dnf:
        name: "*"
        state: latest
      tags: [update]