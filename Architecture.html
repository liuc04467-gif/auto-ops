<style>
:root {
  color-scheme: light;
  --surface: #F7F7F8;
  --surface-muted: #EFEFF2;
  --text: #171717;
  --text-muted: #52525B;
  --border: rgba(23, 23, 23, 0.12);
  --brand: #4B3FE3;
  --brand-soft: #F2F7FF;
  --brand-soft-strong: #E5EAFF;
  --brand-text: #1A1759;
  --brand-on: #FFFFFF;
  --chart-series-1: #3C2ECA;
  --chart-series-2: #A9AEFF;
  --chart-series-3: #6F6FFF;
  --chart-series-4: #22A5F7;
  --chart-other: #D3D4DA;
  --accent: #27D2BF;
  --accent-2: #F87454;
  --accent-soft: #EAFBF8;
  --accent-text: #0F766E;
  --success: #1DC981;
  --warning: #EFAA17;
  --danger: #E8463A;
  --radius: 8px;
  --radius-card: 12px;
  --radius-full: 999px;
  --spacer-4: 4px;
  --spacer-8: 8px;
  --spacer-12: 12px;
  --spacer-16: 16px;
  --spacer-20: 20px;
  --spacer-24: 24px;
  --font-sans: "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-metric: "Inter", "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-strong: 600;
  --text-caption: 12px/18px;
  --text-body: 14px/20px;
  --text-title: 16px/24px;
  --text-code: 13px/20px;
}
:root[data-widget-theme="dark"] {
  color-scheme: dark;
  --surface: #171717;
  --surface-muted: #262626;
  --text: #E5E5E5;
  --text-muted: #A1A1AA;
  --border: rgba(229, 229, 229, 0.12);
  --brand: #6054F1;
  --brand-soft: #1A1759;
  --brand-soft-strong: #3C2ECA;
  --brand-text: #CFD8FF;
  --chart-series-1: #4B3FE3;
  --accent-2: #F87454;
  --accent-soft: #123F3C;
  --accent-text: #CCFBF1;
}
.widget {
  color: var(--text);
  background: transparent;
  font: var(--weight-regular) var(--text-body) var(--font-sans);
  letter-spacing: 0;
}
.t { fill: var(--text); font: var(--weight-regular) var(--text-body) var(--font-sans); }
.th { fill: var(--text); font: var(--weight-medium) var(--text-body) var(--font-sans); }
.ts { fill: var(--text-muted); font: var(--weight-regular) var(--text-caption) var(--font-sans); }
.tc { fill: var(--text-muted); font: var(--weight-medium) var(--text-code) var(--font-mono); }
.arr { stroke: var(--text-muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.leader { stroke: var(--text-muted); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 5 4; fill: none; }
.arr-brand { stroke: var(--brand); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.leader-brand { stroke: var(--brand); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 5 4; fill: none; }

g.c-neutral > rect, rect.c-neutral { fill: var(--surface); stroke: var(--border); }
g.c-brand > rect, rect.c-brand { fill: var(--brand-soft); stroke: var(--brand); }
.c-brand > .th { fill: var(--brand-text); }
.c-brand > .ts { fill: var(--brand); }
g.c-external > rect, rect.c-external { fill: var(--surface-muted); stroke: var(--border); stroke-dasharray: 6 3; }
.c-external > .th { fill: var(--text); }
.c-external > .ts { fill: var(--text-muted); }
g.c-boundary > rect, rect.c-boundary { fill: none; stroke: var(--border); stroke-dasharray: 6 3; }
.c-boundary > .th { fill: var(--text-muted); }
.c-boundary > .ts { fill: var(--text-muted); }

.badge-master { fill: var(--brand-soft-strong); stroke: var(--brand); }
.badge-backup { fill: var(--surface-muted); stroke: var(--text-muted); }
.badge-primary { fill: var(--brand-soft-strong); stroke: var(--brand); }
.badge-replica { fill: var(--surface-muted); stroke: var(--text-muted); }
</style>
