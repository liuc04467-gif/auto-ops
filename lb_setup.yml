---
- name: Setup HAProxy + Keepalived on lb01 and lb02
  hosts: lb
  gather_facts: yes
  vars:
    vip: "10.0.0.100"
    vip_interface: "ens33"
    lb01_priority: 100
    lb02_priority: 90
    backend_servers:
      - name: web01
        ip: "10.0.0.13"
        port: 80
      - name: web02
        ip: "10.0.0.14"
        port: 80

  tasks:
    # ========================================
    # 1. 安装 HAProxy + Keepalived
    # ========================================
    - name: Install haproxy and keepalived
      dnf:
        name:
          - haproxy
          - keepalived
        state: present

    # ========================================
    # 2. 配置 HAProxy
    # ========================================
    - name: Configure HAProxy
      copy:
        content: |
          global
              log         127.0.0.1 local2
              chroot      /var/lib/haproxy
              pidfile     /var/run/haproxy.pid
              maxconn     4000
              user        haproxy
              group       haproxy
              daemon

          defaults
              mode                    http
              log                     global
              option                  httplog
              option                  dontlognull
              option                  http-server-close
              option                  redispatch
              retries                 3
              timeout http-request    10s
              timeout queue           1m
              timeout connect         10s
              timeout client          1m
              timeout server          1m
              timeout http-keep-alive 10s
              timeout check           10s
              maxconn                 3000

          frontend http-in
              bind *:80
              default_backend web_servers

          backend web_servers
              balance roundrobin
              option httpchk GET /
              server web01 10.0.0.13:80 check inter 2000 rise 2 fall 3
              server web02 10.0.0.14:80 check inter 2000 rise 2 fall 3

          # HAProxy stats page (optional)
          listen stats
              bind *:8404
              mode http
              stats enable
              stats uri /stats
              stats realm HAProxy\ Statistics
              stats auth admin:admin123
        dest: /etc/haproxy/haproxy.cfg
        backup: yes
      notify: restart haproxy

    # ========================================
    # 3. 配置 Keepalived
    # ========================================
    - name: Set priority based on hostname
      set_fact:
        keepalived_priority: "{{ 100 if inventory_hostname == 'lb01' else 90 }}"

    - name: Configure Keepalived
      copy:
        content: |
          vrrp_script chk_haproxy {
              script "killall -0 haproxy"
              interval 2
              weight -20
          }

          vrrp_instance VI_1 {
              state {{ 'MASTER' if inventory_hostname == 'lb01' else 'BACKUP' }}
              interface {{ vip_interface }}
              virtual_router_id 51
              priority {{ keepalived_priority }}
              advert_int 1
              unicast_src_ip {{ '10.0.0.11' if inventory_hostname == 'lb01' else '10.0.0.12' }}
              unicast_peer {
                  {{ '10.0.0.12' if inventory_hostname == 'lb01' else '10.0.0.11' }}
              }

              authentication {
                  auth_type PASS
                  auth_pass opslab123
              }

              virtual_ipaddress {
                  {{ vip }}/24 dev {{ vip_interface }}
              }

              track_script {
                  chk_haproxy
              }
          }
        dest: /etc/keepalived/keepalived.conf
        backup: yes
      notify: restart keepalived

    # ========================================
    # 4. 调整 SELinux 和防火墙
    # ========================================
    - name: Allow HAProxy to bind any port (SELinux)
      seboolean:
        name: haproxy_connect_any
        state: yes
        persistent: yes
      ignore_errors: yes

    - name: Open firewall for HAProxy, Keepalived, and stats
      firewalld:
        port: "{{ item }}"
        permanent: yes
        state: enabled
      loop:
        - 80/tcp
        - 8404/tcp
      notify: reload firewalld

    - name: Allow VRRP protocol (keepalived)
      firewalld:
        rich_rule: 'rule protocol value="vrrp" accept'
        permanent: yes
        state: enabled
      notify: reload firewalld

    # ========================================
    # 5. 启动服务
    # ========================================
    - name: Enable and start HAProxy
      systemd:
        name: haproxy
        state: started
        enabled: yes

    - name: Enable and start Keepalived
      systemd:
        name: keepalived
        state: started
        enabled: yes

  handlers:
    - name: restart haproxy
      systemd:
        name: haproxy
        state: restarted

    - name: restart keepalived
      systemd:
        name: keepalived
        state: restarted

    - name: reload firewalld
      systemd:
        name: firewalld
        state: reloaded