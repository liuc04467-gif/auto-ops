# OpsLab - 本地开发环境（对齐生产：Nginx + PHP-FPM + MySQL + Redis + Prometheus + Grafana）
# 用法：docker compose up -d
version: "3.8"

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    environment:
      REDIS_WRITE_HOST: redis
      REDIS_READ_HOST: redis
      REDIS_PASSWORD: Redis12345
      DB_HOST: db
      DB_NAME: opslab
      DB_USER: webapp
      DB_PASSWORD: <REDACTED>
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: opslab
      MYSQL_USER: webapp
      MYSQL_PASSWORD: <REDACTED>
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "Redis12345"]
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ../configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: <REDACTED>
    depends_on:
      - prometheus

volumes:
  db_data:
